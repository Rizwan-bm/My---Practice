<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Box Model</title>
  <style>
     <meta charset="UTF-8">
  <title>CSS Box Model</title>
  <style>
   div {
      height: 200px;
      width: 200px;
    }

    p {
      margin: 0;
    }

    #first {
      background-color: cadetblue;
      padding: 20px;
      border: 10px solid black;
    }

    #second {
      background-color: gold;
      border: solid black;
      border-width: 20px 10px;
      margin-left: 260px;
    }

    #third {
      background-color: indianred;
      border: 10px solid black;
      margin-left: 40px;
    }

  </style>
</head>

<body>
<div id="first">
  <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Itaque consectetur optio, magnam saepe, voluptatem eveniet quos, iste quidem delectus laborum iusto rerum sed culpa dolorum accusamus sunt. Mollitia, ducimus rerum.</p>
</div>

<div id="second">

</div>
<div id="third">

</div>
</body>

</html>
